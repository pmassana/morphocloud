[project]
name = "morphocloud"
version = "0.1.0"
description = "Star-galaxy classifier for the DELVE-MC survey"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "astropy>=6",
    "astroquery>=0.4.7",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.3",
    "xgboost>=2",
    "healpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphocloud"]
